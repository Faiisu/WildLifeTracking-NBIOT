<text x="340" y="58" font-family="Arial,sans-serif" font-size="2.5" text-anchor="middle" fill="#16232d">J5</text>
<text x="92" y="107" font-family="Arial,sans-serif" font-size="2.5" text-anchor="start" fill="#16232d">COMMON GROUND</text>
