<text x="160" y="101" font-family="Arial,sans-serif" font-size="2" text-anchor="middle" fill="#16232d">SHDN</text>
<text x="170" y="104" font-family="Arial,sans-serif" font-size="2" text-anchor="middle" fill="#16232d">PG</text>
<text x="235" y="104" font-family="Arial,sans-serif" font-size="2" text-anchor="middle" fill="#16232d">D+ / D- unused</text>
<text x="20" y="18" font-family="Arial,sans-serif" font-size="5" text-anchor="start" fill="#16232d">SOLAR POWER PROTOTYPE - REV A</text>
<text x="20" y="27" font-family="Arial,sans-serif" font-size="3.5" text-anchor="start" fill="#16232d">PROPOSED BENCH ASSEMBLY - NOT RELEASED FOR PCB OR ANIMAL USE</text>
<text x="20" y="36" font-family="Arial,sans-serif" font-size="3" text-anchor="start" fill="#16232d">Logical module interfaces only. Use manufacturer PAD NAMES, not these symbol pin numbers.</text>
<text x="20" y="130" font-family="Arial,sans-serif" font-size="3.2" text-anchor="start" fill="#16232d">J1 cavity 1 = panel positive; cavity 2 = return. Verify both mating halves with a meter.</text>
<text x="20" y="140" font-family="Arial,sans-serif" font-size="3.2" text-anchor="start" fill="#16232d">D1: unbanded ANODE faces panel; banded CATHODE faces regulator VIN.</text>
<text x="20" y="150" font-family="Arial,sans-serif" font-size="3.2" text-anchor="start" fill="#16232d">A2 SHDN and PG: leave unconnected. A3/J2 D+ and D-: leave unconnected.</text>
<text x="20" y="160" font-family="Arial,sans-serif" font-size="3.2" text-anchor="start" fill="#16232d">R12 on A4: existing 2k ~500 mA; conditional bench proposal 10k ~100 mA after battery review.</text>
<text x="20" y="170" font-family="Arial,sans-serif" font-size="3.2" text-anchor="start" fill="#16232d">No MPPT or solar input power tracking. Shade, brownout and battery takeover require bench tests.</text>
<text x="20" y="180" font-family="Arial,sans-serif" font-size="3.2" text-anchor="start" fill="#16232d">Use ONLY A4 USB-C for solar input. NEVER plug a panel into the board battery JST J5.</text>
<text x="20" y="190" font-family="Arial,sans-serif" font-size="3.2" text-anchor="start" fill="#16232d">One VBUS source only. Identify battery/charger variant and temperature limits before charging.</text>
<text x="20" y="205" font-family="Arial,sans-serif" font-size="3.2" text-anchor="start" fill="#16232d">Mass: user baseline 120 g + panel 79 g + regulator 1 g = 200 g BEFORE remaining parts.</text>
<text x="20" y="215" font-family="Arial,sans-serif" font-size="3.2" text-anchor="start" fill="#16232d">Panel is 112 x 136 mm. Mounting area unknown. Final installed mass must be &lt;=240 g.</text>
<text x="20" y="235" font-family="Arial,sans-serif" font-size="3.2" text-anchor="start" fill="#16232d">Sources, BOM, exact wire list and limitations: README.md in this directory.</text>
<text x="20" y="245" font-family="Arial,sans-serif" font-size="3.2" text-anchor="start" fill="#16232d">KiCad loading / ERC and all hardware tests remain outstanding. No footprints or Gerbers.</text>
<text x="85" y="58" font-family="Arial,sans-serif" font-size="2.5" text-anchor="middle" fill="#16232d">RAW SOLAR</text>
