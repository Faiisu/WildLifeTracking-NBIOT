<text x="18" y="18" font-family="Arial,sans-serif" font-size="5" text-anchor="start" fill="#193344">SOLAR / BATTERY POWER PATHS</text>
<text x="18" y="28" font-family="Arial,sans-serif" font-size="3.2" text-anchor="start" fill="#193344">Proposed topology reference - NOT a runnable SPICE model or PCB design</text>
<text x="165" y="43" font-family="Arial,sans-serif" font-size="2.6" text-anchor="start" fill="#193344">EXISTING SPARKFUN nRF9160 THING PLUS - FUNCTIONAL DETAIL</text>
<text x="18" y="225" font-family="Arial,sans-serif" font-size="3" text-anchor="start" fill="#193344">All GND labels are one common net. VBAT labels connect the charger, battery and Q3 input.</text>
<text x="18" y="236" font-family="Arial,sans-serif" font-size="3" text-anchor="start" fill="#193344">Sun available: VBUS powers VSYS through D6 and feeds the charger. Q3 is held off.</text>
<text x="18" y="247" font-family="Arial,sans-serif" font-size="3" text-anchor="start" fill="#193344">No VBUS: the battery powers VSYS through Q3. Weak-sun handover is not guaranteed; test it.</text>
<text x="18" y="258" font-family="Arial,sans-serif" font-size="3" text-anchor="start" fill="#193344">500 mA is a charge ceiling, not a fixed split. Panel must also support board power and losses.</text>
<text x="18" y="269" font-family="Arial,sans-serif" font-size="3" text-anchor="start" fill="#193344">No panel or battery selected. Total installed mass &lt;=240 g. Battery charge limits must be confirmed.</text>
<text x="18" y="280" font-family="Arial,sans-serif" font-size="3" text-anchor="start" fill="#193344">Logical block pin numbers are NOT package pin numbers. No footprints, SPICE models or ERC validation.</text>
