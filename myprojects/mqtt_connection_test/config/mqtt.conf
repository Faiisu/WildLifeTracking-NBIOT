# MQTT over TLS; only the broker CA is needed. Client authentication remains
# username/password based, so do not add a client certificate or private key.
CONFIG_MQTT_HELPER=y
CONFIG_MQTT_CLEAN_SESSION=y
CONFIG_MQTT_LIB_TLS=y
CONFIG_MBEDTLS=y
CONFIG_TLS_CREDENTIALS=y
CONFIG_MODEM_KEY_MGMT=y
CONFIG_MQTT_HELPER_SEC_TAG=24
CONFIG_MQTT_HELPER_PORT=8883

CONFIG_MQTT_TEST_BROKER_HOSTNAME=""
CONFIG_MQTT_TEST_BROKER_PORT=8883
CONFIG_MQTT_TEST_CLIENT_ID="mqtt-connection-test"
CONFIG_MQTT_TEST_USERNAME=""
CONFIG_MQTT_TEST_PASSWORD=""
CONFIG_MQTT_TEST_PUB_TOPIC="test/nrf91"
CONFIG_MQTT_TEST_PAYLOAD="mqtt_connection_test"
CONFIG_MQTT_TEST_PUB_QOS=0
