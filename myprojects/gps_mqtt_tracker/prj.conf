# The default configuration is split by subsystem under config/ and loaded by
# CMakeLists.txt through EXTRA_CONF_FILE. Keep this file as the standard Zephyr
# project configuration entry point.
#
# Edit the matching fragment instead of adding unrelated settings here:
#   config/system.conf      C library, floating point, stack, and heap
#   config/logging.conf     RTT logging and serial/console policy
#   config/hardware.conf    GPIO and LED behavior
#   config/networking.conf  Zephyr networking and socket offload
#   config/modem.conf       modem, LTE, GNSS radio mode, and power modules
#   config/mqtt.conf        MQTT library and broker destination
#   config/tracker.conf     GNSS schedule, PSM timing, and diagnostics
