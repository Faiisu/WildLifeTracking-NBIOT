# RTT-only logging; no UART/serial console or interactive serial backends
CONFIG_LOG=y
CONFIG_LOG_PRINTK=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_RTT_MODE_DROP=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_UART_INTERRUPT_DRIVEN=n
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_AT_HOST_LIBRARY=n
CONFIG_TFM_LOG_LEVEL_SILENCE=y
CONFIG_TFM_SECURE_UART=n

# Disable periodic LEDs in the battery-powered configuration
CONFIG_GPIO=y
CONFIG_STARTUP_LED=n
CONFIG_DK_LIBRARY=n

# Newlib & Floating Point Printf
CONFIG_NEWLIB_LIBC=y
CONFIG_FPU=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y

# Networking
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=n
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_SOCKETS=y

# Memory Configurations
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=8192

# Modem Library & Key Management
CONFIG_NRF_MODEM_LIB=y

# LTE Link Control & GNSS Functional Mode
CONFIG_LTE_LINK_CONTROL=y
CONFIG_LTE_NETWORK_MODE_LTE_M_NBIOT_GPS=y
CONFIG_LTE_LC_EDRX_MODULE=n
CONFIG_LTE_LC_PSM_MODULE=y
CONFIG_LTE_LC_MODEM_SLEEP_MODULE=y

# MQTT Helper Library
CONFIG_MQTT_HELPER=y
CONFIG_MQTT_CLEAN_SESSION=y

# MQTT destination
CONFIG_MQTT_BROKER_HOSTNAME="0.tcp.ap.ngrok.io" #tcp
CONFIG_MQTT_BROKER_PORT=18047
CONFIG_MQTT_HELPER_PORT=18047
CONFIG_MQTT_CLIENT_ID="nrf91_1" # Optional fixed ID; leave empty to use modem IMEI
CONFIG_MQTT_PUB_TOPIC="test/nrf91"

# get location system config
CONFIG_TRACKER_PERIODIC_INTERVAL=300
CONFIG_TRACKER_PERIODIC_TIMEOUT=300
CONFIG_TRACKER_PSM_PERIODIC_TAU_SECONDS=28800
CONFIG_TRACKER_PSM_ACTIVE_TIME_SECONDS=0
CONFIG_TRACKER_PSM_ENTRY_TIMEOUT_SECONDS=60
CONFIG_TRACKER_GNSS_DIAGNOSTICS=n
