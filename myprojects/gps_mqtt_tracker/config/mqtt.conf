# Nordic MQTT Helper library.
CONFIG_MQTT_HELPER=y
CONFIG_MQTT_CLEAN_SESSION=y

# TLS server verification
CONFIG_MQTT_LIB_TLS=y
CONFIG_MBEDTLS=y
CONFIG_TLS_CREDENTIALS=y
CONFIG_MODEM_KEY_MGMT=y
CONFIG_MQTT_HELPER_SEC_TAG=24


# Development broker destination. Keep both port settings equal.
CONFIG_MQTT_BROKER_HOSTNAME="53d94aecfc6f4470953c35564bb9dc4c.s1.eu.hivemq.cloud"
CONFIG_MQTT_BROKER_PORT=8883
CONFIG_MQTT_HELPER_PORT=8883
CONFIG_MQTT_CLIENT_ID="WLTK01" # Leave empty to derive the client ID from IMEI.
CONFIG_MQTT_PUB_TOPIC="test/nrf91"
# Wait for the broker's PUBACK before treating a location as delivered.
CONFIG_MQTT_PUB_QOS=1
