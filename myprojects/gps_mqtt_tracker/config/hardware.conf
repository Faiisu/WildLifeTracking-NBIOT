# Disable periodic LED load so status-to-status power measurements represent
# the modem/application state rather than a one-second GPIO power pulse.
CONFIG_GPIO=y
CONFIG_STARTUP_LED=y

# DK status LEDs are not used by the supported Circuit Dojo/SparkFun boards.
CONFIG_DK_LIBRARY=n
