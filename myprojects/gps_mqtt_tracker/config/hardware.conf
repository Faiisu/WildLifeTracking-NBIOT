# Disable periodic LED load so status-to-status power measurements represent
# the modem/application state rather than a one-second GPIO power pulse.
CONFIG_GPIO=y
CONFIG_STARTUP_LED=y

# DK_LIBRARY defaults to n and is pulled in automatically by
# CONFIG_ENABLE_LEDS (see Kconfig) when status LEDs are enabled; it must not
# be hardcoded here or it would conflict with that selection.
