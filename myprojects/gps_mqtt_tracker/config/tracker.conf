# GNSS fix schedule.
CONFIG_TRACKER_PERIODIC_INTERVAL=300
CONFIG_TRACKER_PERIODIC_TIMEOUT=300

# Requested PSM behavior after each upload.
CONFIG_TRACKER_PSM_PERIODIC_TAU_SECONDS=300
CONFIG_TRACKER_PSM_ACTIVE_TIME_SECONDS=0
CONFIG_TRACKER_PSM_ENTRY_TIMEOUT_SECONDS=60

# Keep periodic PVT/NMEA console activity out of power traces. Fixed STATUS:
# transition markers remain enabled through the normal logging configuration.
CONFIG_TRACKER_GNSS_DIAGNOSTICS=n
