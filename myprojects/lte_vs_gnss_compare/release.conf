#
# Release / low-power measurement overlay.
# Disables logging, RTT, and LEDs for clean power profiling of Stage 1 vs Stage 2.
# Usage:
#   west build -p always -b sparkfun_thing_plus/nrf9160/ns \
#     myprojects/lte_vs_gnss_compare --sysbuild -- -DEXTRA_CONF_FILE=release.conf
#

CONFIG_LOG=n
CONFIG_USE_SEGGER_RTT=n
CONFIG_LOG_BACKEND_RTT=n
CONFIG_LOG_BACKEND_RTT_MODE_DROP=n
CONFIG_ASSERT=n
CONFIG_THREAD_NAME=n
CONFIG_COMPARE_STATUS_LED=n
