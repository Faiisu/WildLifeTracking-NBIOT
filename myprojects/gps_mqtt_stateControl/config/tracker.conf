# Shared GNSS acquisition settings; main.c stops GNSS after each manual attempt.
CONFIG_TRACKER_PERIODIC_INTERVAL=300
CONFIG_TRACKER_PERIODIC_TIMEOUT=180

# Requested PSM behavior after each upload.
CONFIG_TRACKER_PSM_PERIODIC_TAU_SECONDS=300
CONFIG_TRACKER_PSM_ACTIVE_TIME_SECONDS=0
CONFIG_TRACKER_PSM_ENTRY_TIMEOUT_SECONDS=60

# Enable GNSS diagnostics while manually inspecting the acquisition state.
CONFIG_TRACKER_GNSS_DIAGNOSTICS=y
