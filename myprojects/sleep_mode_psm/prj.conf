# Application memory sizing (sized for MQTT + TLS + cell JSON formatting)
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=8192

# RTT-only logging; keep UART/console disabled to avoid serial power draw
CONFIG_LOG=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_RTT_MODE_DROP=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_UART_INTERRUPT_DRIVEN=n
CONFIG_TFM_LOG_LEVEL_SILENCE=y
CONFIG_TFM_SECURE_UART=n

# Modem, LTE Link Control, Cell Measurement, and PSM (eDRX disabled)
CONFIG_NRF_MODEM_LIB=y
CONFIG_LTE_LINK_CONTROL=y
CONFIG_LTE_NETWORK_MODE_LTE_M_NBIOT=y
CONFIG_LTE_LC_NEIGHBOR_CELL_MEAS_MODULE=y
CONFIG_LTE_NEIGHBOR_CELLS_MAX=6
CONFIG_LTE_LC_PSM_MODULE=y
CONFIG_LTE_LC_EDRX_MODULE=n
CONFIG_LTE_LC_MODEM_SLEEP_MODULE=y
CONFIG_LTE_LC_MODEM_SLEEP_NOTIFICATIONS_THRESHOLD_MS=60000

# Networking offload required by nRF modem library
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y

# MQTT Helper + TLS
CONFIG_MQTT_HELPER=y
CONFIG_MQTT_CLEAN_SESSION=y
CONFIG_MQTT_LIB_TLS=y
CONFIG_MBEDTLS=y
CONFIG_TLS_CREDENTIALS=y
CONFIG_MODEM_KEY_MGMT=y
CONFIG_MQTT_HELPER_SEC_TAG=24
CONFIG_MQTT_BROKER_PORT=8883
CONFIG_MQTT_HELPER_PORT=8883
CONFIG_MQTT_PUB_TOPIC="test/nrf91"
CONFIG_MQTT_PUB_QOS=1
CONFIG_MQTT_CLIENT_ID="WLTK01"

# Power management for suspending unused peripherals (e.g. external flash DPD)
CONFIG_PM_DEVICE=y
CONFIG_FLASH=y
CONFIG_SPI_NOR=y

# GPIO, I2C, and LIS2DH12 (powered down ODR=0; wake via MODE button or 30s timer)
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_LIS2DH=y
CONFIG_LIS2DH_TRIGGER_NONE=y
CONFIG_LIS2DH_OPER_MODE_LOW_POWER=y
CONFIG_LIS2DH_ACCEL_RANGE_2G=y
CONFIG_LIS2DH_ODR_RUNTIME=y

# State timings: LTE wait 30s -> get location -> MQTT -> sleep 30s (MODE or timer wake)
CONFIG_SLEEP_APP_LTE_CONNECT_TIMEOUT_SECONDS=30
CONFIG_SLEEP_APP_CELL_MEAS_TIMEOUT_SECONDS=30
CONFIG_SLEEP_APP_INTERVAL_SECONDS=30
CONFIG_SLEEP_APP_MOTION_WAKEUP=n
CONFIG_SLEEP_APP_BUTTON_WAKEUP=y
CONFIG_SLEEP_APP_STATUS_LED=y
