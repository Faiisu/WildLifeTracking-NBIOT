# Logging
CONFIG_LOG=y

# Modem-offloaded networking
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y

# Memory
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=4096

# nRF modem and LTE Link Control
CONFIG_NRF_MODEM_LIB=y
CONFIG_LTE_LINK_CONTROL=y
CONFIG_LTE_NETWORK_MODE_LTE_M_NBIOT=y

# MQTT Helper (plaintext test connection)
CONFIG_MQTT_HELPER=y
CONFIG_MQTT_CLEAN_SESSION=y
CONFIG_MQTT_HELPER_PORT=23347

# MQTT destination
CONFIG_MQTT_BROKER_HOSTNAME="0.tcp.ap.ngrok.io"
CONFIG_MQTT_TEST_PAYLOAD="{\"message\":\"hello from nRF9160\"}"
CONFIG_MQTT_PUBLISH_INTERVAL_SECONDS=30
CONFIG_MQTT_CLIENT_ID="" # Optional fixed ID; leave empty to use modem IMEI
CONFIG_MQTT_PUB_TOPIC="test/nrf91"