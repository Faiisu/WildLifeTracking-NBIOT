services:
  influxdb:
    image: influxdb:3-core
    command:
      - influxdb3
      - serve
      - --node-id=esp32-power-monitor
      - --object-store=file
      - --data-dir=/var/lib/influxdb3/data
      - --http-bind=0.0.0.0:8181
      - --without-auth
    ports:
      - "127.0.0.1:8181:8181"
    volumes:
      - influxdb-data:/var/lib/influxdb3/data
    restart: unless-stopped

volumes:
  influxdb-data:
