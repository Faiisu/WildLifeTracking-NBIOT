# Nordic MQTT Helper library.
CONFIG_MQTT_HELPER=y
CONFIG_MQTT_CLEAN_SESSION=y

# TLS server verification.
CONFIG_MQTT_LIB_TLS=y
CONFIG_MBEDTLS=y
CONFIG_TLS_CREDENTIALS=y
CONFIG_MODEM_KEY_MGMT=y
CONFIG_MQTT_HELPER_SEC_TAG=24

# Generic TLS port default; keep both port settings equal.
CONFIG_MQTT_BROKER_PORT=8883
CONFIG_MQTT_HELPER_PORT=8883

# Leave empty to derive nrf-<IMEI> from AT+CGSN automatically.
CONFIG_MQTT_CLIENT_ID=""
CONFIG_MQTT_PUB_TOPIC="test/nrf91/cell"
# Wait for broker PUBACK before evicting a cell report from the backlog.
CONFIG_MQTT_PUB_QOS=1
