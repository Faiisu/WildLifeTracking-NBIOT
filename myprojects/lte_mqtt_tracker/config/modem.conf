# nRF modem library and LTE Link Control (LTE-M / NB-IoT without GNSS).
CONFIG_NRF_MODEM_LIB=y
CONFIG_LTE_LINK_CONTROL=y
CONFIG_LTE_NETWORK_MODE_LTE_M_NBIOT=y

# Enable serving and neighbor cell measurements for cellular positioning.
CONFIG_LTE_LC_NEIGHBOR_CELL_MEAS_MODULE=y
CONFIG_LTE_NEIGHBOR_CELLS_MAX=6

# Request PSM and observe modem sleep; eDRX is disabled.
CONFIG_LTE_LC_EDRX_MODULE=n
CONFIG_LTE_LC_PSM_MODULE=y
CONFIG_LTE_LC_MODEM_SLEEP_MODULE=y
