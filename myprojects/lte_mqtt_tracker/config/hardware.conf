# Show LTE registration, cell scan, and MQTT upload as 2/3/4 blink groups.
CONFIG_GPIO=y
CONFIG_STARTUP_LED=y
CONFIG_WORKING_LED_BLINK_INTERVAL_MS=200
CONFIG_WORKING_LED_GROUP_PAUSE_MS=1000

# DK_LIBRARY defaults to n and is pulled in automatically by
# CONFIG_ENABLE_LEDS (see Kconfig) when status LEDs are enabled.
