# GNSS-only baseline matching samples/gps defaults on NCS v3.3.0.
CONFIG_TFM_PROFILE_TYPE_MINIMAL=y
CONFIG_NRF_MODEM_LIB=y
CONFIG_LTE_LINK_CONTROL=y
CONFIG_LTE_NETWORK_MODE_LTE_M_GPS=y
CONFIG_GNSS_SAMPLE_MODE_CONTINUOUS=y
CONFIG_GNSS_SAMPLE_POWER_SAVING_DISABLED=y
CONFIG_GNSS_SAMPLE_ASSISTANCE_NONE=y
CONFIG_GNSS_SAMPLE_LOW_ACCURACY=n
CONFIG_GNSS_SAMPLE_NMEA_ONLY=n

# Preserve floating-point PVT output and GNSS sample memory requirements.
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y
CONFIG_FPU=y
CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1536
CONFIG_GPIO=y
CONFIG_POLL=y
CONFIG_GNSS_HEARTBEAT_LED=y
CONFIG_GNSS_HEARTBEAT_INTERVAL_MS=1000

# Both printf console output and logging use RTT, channel 0.
CONFIG_USE_SEGGER_RTT=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=8192
CONFIG_SEGGER_RTT_MODE_NO_BLOCK_SKIP=y
CONFIG_CONSOLE=y
CONFIG_RTT_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_PRINTK=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_RTT_MODE_DROP=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n
CONFIG_AT_HOST_LIBRARY=n
CONFIG_TFM_LOG_LEVEL_SILENCE=y
CONFIG_TFM_SECURE_UART=n
