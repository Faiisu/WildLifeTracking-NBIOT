sample:
  name: SparkFun nRF9160 Thing Plus Blinky
  description: Blinks the onboard blue LED using the led0 devicetree alias.

common:
  tags:
    - gpio
    - LED
  depends_on: gpio
  filter: dt_compat_enabled_with_alias("gpio-leds", "led0")
  harness: led

tests:
  sample.sparkfun_thing_plus.blinky:
    integration_platforms:
      - sparkfun_thing_plus/nrf9160/ns
    platform_allow:
      - sparkfun_thing_plus/nrf9160/ns
