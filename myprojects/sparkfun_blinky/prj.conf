# GPIO drives the onboard blue LED through the board's led0 devicetree alias.
CONFIG_GPIO=y

# Produce an MCUboot-compatible application image for the board's USB DFU flow.
CONFIG_BOOTLOADER_MCUBOOT=y

# Application defaults.
CONFIG_BLINK_INTERVAL_MS=1000

# Report LED state through the USB serial console.
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
