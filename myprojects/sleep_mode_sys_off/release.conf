#
# Release / low-power measurement overlay.
# Disables logging, RTT, and LEDs for microamp System OFF profiling.
# Usage:
#   west build -p always -b sparkfun_thing_plus/nrf9160/ns \
#     myprojects/sleep_mode_sys_off --sysbuild -- -DEXTRA_CONF_FILE=release.conf
#

CONFIG_LOG=n
CONFIG_USE_SEGGER_RTT=n
CONFIG_LOG_BACKEND_RTT=n
CONFIG_LOG_BACKEND_RTT_MODE_DROP=n
CONFIG_ASSERT=n
CONFIG_THREAD_NAME=n
CONFIG_SLEEP_APP_STATUS_LED=n
